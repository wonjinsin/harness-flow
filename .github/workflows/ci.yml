name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate skills
        run: node scripts/validate-skills.js
      - name: Run deterministic workflow evals
        run: node scripts/eval-skills.js
      - name: Run tests
        run: node --test
