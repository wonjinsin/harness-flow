name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills
        run: node scripts/validate-skills.js
      - name: Run deterministic workflow evals
        run: node scripts/eval-skills.js
      - name: Run tests
        run: node --test
